# Render placeholders privately, then use: gcloud run services replace FILE --project PROJECT --region REGION
# Deploy only after the logging inventory and provider evidence gates pass.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: private-chat-gateway
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/maxScale: '2'
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '2'
        autoscaling.knative.dev/minScale: '0'
    spec:
      serviceAccountName: GATEWAY_SERVICE_ACCOUNT
      containerConcurrency: 8
      timeoutSeconds: 75
      containers:
        - image: GATEWAY_IMAGE_AT_SHA256_DIGEST
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
          env:
            - name: GOOGLE_CLOUD_PROJECT
              value: INFERENCE_PROJECT_ID
            - name: APP_CHECK_APP_IDS
              value: '["REGISTERED_FIREBASE_IOS_APP_ID"]'
            - name: OPENAI_KEY_FILE
              value: /secrets/openai/key
            - name: VOUCHER_PUBLIC_KEYS_FILE
              value: /secrets/voucher/public-keys
            - name: VOUCHER_ISSUER
              value: BILLING_SERVICE_ORIGIN
            - name: VOUCHER_AUDIENCE
              value: GATEWAY_SERVICE_ORIGIN
          volumeMounts:
            - name: openai
              mountPath: /secrets/openai
            - name: voucher
              mountPath: /secrets/voucher
      volumes:
        - name: openai
          secret:
            secretName: OPENAI_SECRET_NAME
            items:
              - key: IMMUTABLE_SECRET_VERSION
                path: key
        - name: voucher
          secret:
            secretName: VOUCHER_PUBLIC_KEYS_SECRET_NAME
            items:
              - key: IMMUTABLE_SECRET_VERSION
                path: public-keys
